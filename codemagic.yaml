workflows:
  ios-stadium-audio:
    name: StadiumAudio Unsigned IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned IPA for Sideloadly
        script: |
          set -e
          echo "=== Step 1: Listing Workspace Files ==="
          ls -la
          
          echo "=== Step 2: Running Xcode Archive ==="
          xcodebuild archive \
            -project StadiumAudio/StadiumAudio.xcodeproj \
            -scheme StadiumAudio \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/StadiumAudio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "=== Step 3: Checking Archive Content ==="
          ls -la $CM_BUILD_DIR/StadiumAudio.xcarchive/Products/Applications/

          echo "=== Step 4: Creating Payload Structure ==="
          mkdir -p Payload
          cp -R $CM_BUILD_DIR/StadiumAudio.xcarchive/Products/Applications/StadiumAudio.app Payload/
          zip -r -9 StadiumAudio.ipa Payload/
          mv StadiumAudio.ipa $CM_BUILD_DIR/StadiumAudio.ipa
          
          echo "=== Step 5: Verification ==="
          ls -lh $CM_BUILD_DIR/StadiumAudio.ipa
    artifacts:
      - StadiumAudio.ipa
