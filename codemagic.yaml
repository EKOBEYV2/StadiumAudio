workflows:
  ios-stadium-audio:
    name: StadiumAudio Unsigned IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned IPA for Sideloadly
        script: |
          cd StadiumAudio
          xcodebuild archive \
            -project StadiumAudio.xcodeproj \
            -scheme StadiumAudio \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/StadiumAudio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -R $CM_BUILD_DIR/StadiumAudio.xcarchive/Products/Applications/StadiumAudio.app Payload/
          zip -r -9 StadiumAudio.ipa Payload/
          mv StadiumAudio.ipa $CM_BUILD_DIR/StadiumAudio.ipa
    artifacts:
      - StadiumAudio.ipa
