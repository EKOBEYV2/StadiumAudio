workflows:
  ios-stadium-audio:
    name: StadiumAudio Unsigned IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Unsigned IPA for Sideloadly
        script: |
          set -e
          echo "=== Step 1: Navigating to StadiumAudio ==="
          cd StadiumAudio
          
          echo "=== Step 2: Running Xcode Archive ==="
          xcodebuild archive \
            -project StadiumAudio.xcodeproj \
            -scheme StadiumAudio \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/StadiumAudio.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "=== Step 3: Package Payload ==="
          cd $CM_BUILD_DIR
          mkdir -p Payload
          cp -R StadiumAudio.xcarchive/Products/Applications/StadiumAudio.app Payload/
          zip -r -9 StadiumAudio.ipa Payload/
          
          echo "=== Step 4: Verification ==="
          ls -lh StadiumAudio.ipa
    artifacts:
      - $CM_BUILD_DIR/StadiumAudio.ipa
